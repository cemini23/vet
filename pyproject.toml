[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-vet"
version = "0.2.0"
description = "Static veto-gate auditor for agent skills, briefs, and prompts"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "cemini23" }]
keywords = ["agents", "skills", "audit", "llm", "mcp", "quality"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/vet"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
vet = "vet.cli:main"

[project.urls]
Homepage = "https://github.com/cemini23/vet"
Repository = "https://github.com/cemini23/vet"
Issues = "https://github.com/cemini23/vet/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
